<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Distritos de Panamá</title>

    <!-- LEAFLET -->
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>

        body{
            margin:0;
            padding:0;
        }

        #map{
            width:100%;
            height:100vh;
        }

        .titulo{
            position:absolute;
            top:10px;
            left:60px;
            z-index:1000;
            background:white;
            padding:12px;
            border-radius:10px;
            font-family:Arial;
            font-size:20px;
            font-weight:bold;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }

    </style>
</head>

<body>

<div class="titulo">
    Distritos de Panamá
</div>

<div id="map"></div>

<!-- LEAFLET -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

    // CREAR MAPA
    var map = L.map('map').setView([8.5, -80], 7);

    // MAPA BASE
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap'
        }
    ).addTo(map);

    // FUNCIÓN DE COLORES
    function getColor(){

        var colores = [
            "#ff0000",
            "#00ff00",
            "#0000ff",
            "#ffff00",
            "#ff00ff",
            "#00ffff",
            "#ffa500",
            "#800080",
            "#008000",
            "#8b4513",
            "#ff1493",
            "#4682b4"
        ];

        return colores[Math.floor(Math.random() * colores.length)];
    }

    // CARGAR GEOJSON LOCAL
    fetch("Distritos.geojson")

    .then(response => response.json())

    .then(data => {

        console.log(data);

        var distritos = L.geoJSON(data, {

            style:function(feature){

                return{
                    color:"black",
                    weight:1,
                    fillColor:getColor(),
                    fillOpacity:0.5
                };
            },

            onEachFeature:function(feature, layer){

                var nombre = "Distrito";

                if(feature.properties){

                    nombre =
                    feature.properties.NOMBRE ||
                    feature.properties.NAME_2 ||
                    feature.properties.DISTRITO ||
                    feature.properties.name ||
                    "Distrito";
                }

                layer.bindPopup(
                    "<h3>" + nombre + "</h3>"
                );
            }

        }).addTo(map);

        // AJUSTAR MAPA
        map.fitBounds(distritos.getBounds());

    })

    .catch(error => {

        console.error(error);

        alert("No se pudo cargar el archivo GeoJSON");

    });

</script>

</body>
</html>
