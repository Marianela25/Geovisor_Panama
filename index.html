<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geovisor Panamá</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body{
  height:100%;
  margin:0;
  padding:0;
}

#map{
  height:100vh;
  width:100%;
}

.titulo{
  position:absolute;
  top:10px;
  left:60px;
  z-index:1000;
  background:white;
  padding:10px 20px;
  border-radius:10px;
  font-family:Arial;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.legend{
  background:white;
  padding:10px;
  border-radius:10px;
  line-height:25px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  font-family:Arial;
}
</style>

</head>

<body>

<div class="titulo">
  <h2>Geovisor Panamá</h2>
</div>

<div id="map"></div>

<script>

// CREAR MAPA
const map = L.map('map').setView([8.3, -80.2], 8);

// MAPA BASE
const osm = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap'
  }
).addTo(map);

// MAPA SATELITAL
const satelite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    attribution:'Esri'
  }
);

// CONTROL DE CAPAS
const baseMaps = {
  "OpenStreetMap": osm,
  "Satélite": satelite
};

L.control.layers(baseMaps).addTo(map);

// FUNCIÓN PARA CREAR PUNTOS
function crearPunto(lat, lon, color, nombre, provincia, categoria){
  return L.circleMarker([lat, lon], {
    radius: 9,
    color: "black",
    weight: 1,
    fillColor: color,
    fillOpacity: 0.9
  }).addTo(map)
  .bindPopup(`
    <h2>${nombre}</h2>
    <p><b>Provincia:</b> ${provincia}</p>
    <p><b>Categoría:</b> ${categoria}</p>
  `);
}

// PUNTOS TURÍSTICOS
crearPunto(8.5246, -79.8897, "red", "Playa Coronado", "Panamá Oeste", "Turismo");
crearPunto(8.3765, -80.1086, "blue", "Playa Santa Clara", "Coclé", "Aguas tranquilas");
crearPunto(8.3515, -80.1469, "green", "Playa Farallón", "Coclé", "Ecoturismo");
crearPunto(7.4335, -80.1875, "orange", "Playa Venao", "Los Santos", "Surf");

// AJUSTAR ZOOM A LOS PUNTOS
const bounds = [
  [8.5246, -79.8897],
  [8.3765, -80.1086],
  [8.3515, -80.1469],
  [7.4335, -80.1875]
];

map.fitBounds(bounds, {
  padding: [50, 50]
});

// LEYENDA
const legend = L.control({position:'bottomright'});

legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');

  div.innerHTML = `
    <h3>Leyenda</h3>
    <span style="color:red;">●</span> Turismo<br>
    <span style="color:blue;">●</span> Aguas tranquilas<br>
    <span style="color:green;">●</span> Ecoturismo<br>
    <span style="color:orange;">●</span> Surf
  `;

  return div;
};

legend.addTo(map);

</script>

</body>
</html>
