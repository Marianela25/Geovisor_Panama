     <!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapa de Panamá con Penonomé y Clima</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        #map{
            height:100vh;
            width:100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Librería para leer SHP -->
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>

<script>

    // CREAR MAPA
    var map = L.map('map').setView([8.51, -80.36], 9);

    // MAPA BASE
    var osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap'
        }
    ).addTo(map);

    // CAPA CLIMÁTICA
    var clima = L.tileLayer(
        'https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=TU_API_KEY',
        {
            attribution:'OpenWeatherMap'
        }
    );

    // CARGAR SHAPEFILE DE PENONOMÉ
    shp("data/penonome.zip").then(function(data){

        var penonome = L.geoJSON(data,{
            style:{
                color:"red",
                weight:3,
                fillColor:"orange",
                fillOpacity:0.4
            },
            onEachFeature:function(feature, layer){

                if(feature.properties){

                    layer.bindPopup(
                        "<b>Distrito:</b> " +
                        feature.properties.NAME_2
                    );
                }
            }
        }).addTo(map);

        // AJUSTAR MAPA
        map.fitBounds(penonome.getBounds());

        // CONTROL DE CAPAS
        var overlays = {
            "Clima": clima,
            "Penonomé": penonome
        };

        L.control.layers(
            {"OpenStreetMap":osm},
            overlays
        ).addTo(map);

    });

</script>

</body>
</html>
