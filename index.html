<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geovisor de Playas de Panamá</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
}

header{
    background:linear-gradient(90deg,#0099cc,#00c9a7);
    color:white;
    text-align:center;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

header h1{
    margin-bottom:8px;
}

#map{
    width:100%;
    height:calc(100vh - 110px);
}

.legend{
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
    line-height:1.8;
}

.symbol{
    width:15px;
    height:15px;
    display:inline-block;
    border-radius:50%;
    margin-right:5px;
}

.surf{
    background:#ff6b6b;
}

.turistica{
    background:#ffd93d;
}

.familiar{
    background:#6bcb77;
}

.natural{
    background:#4d96ff;
}
</style>

</head>
<body>

<header>
    <h1>🌊 Geovisor de Playas de Panamá</h1>
    <p>Mapa interactivo con simbología creativa</p>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Crear mapa
const map = L.map('map').setView([8.5380,-80.7821],7);

// Capa base OpenStreetMap
L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

// Playas
const playas = [

{
nombre:"Playa Venao",
coords:[7.433,-80.187],
tipo:"surf",
emoji:"🏄"
},

{
nombre:"Playa Blanca",
coords:[8.356,-80.149],
tipo:"familiar",
emoji:"👨‍👩‍👧"
},

{
nombre:"Isla Grande",
coords:[9.626,-79.566],
tipo:"turistica",
emoji:"🌴"
},

{
nombre:"Santa Catalina",
coords:[7.633,-81.250],
tipo:"surf",
emoji:"🏄"
},

{
nombre:"Red Frog Beach",
coords:[9.343,-82.192],
tipo:"natural",
emoji:"🐚"
}

];

// Colores
const colores = {
surf:"#ff6b6b",
turistica:"#ffd93d",
familiar:"#6bcb77",
natural:"#4d96ff"
};

// Marcadores
playas.forEach(playa => {

const icono = L.divIcon({
html:`
<div style="
width:40px;
height:40px;
border-radius:50%;
background:${colores[playa.tipo]};
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
border:3px solid white;
box-shadow:0 0 8px rgba(0,0,0,.4);
">
${playa.emoji}
</div>
`,
className:"",
iconSize:[40,40]
});

L.marker(playa.coords,{icon:icono})
.addTo(map)
.bindPopup(`
<h3>${playa.nombre}</h3>
<b>Tipo:</b> ${playa.tipo}
`);

});

// Leyenda
const legend = L.control({position:'bottomright'});

legend.onAdd = function(){

const div = L.DomUtil.create('div','legend');

div.innerHTML=`
<h4>🏖️ Simbología</h4>

<div>
<span class="symbol surf"></span>
Surf
</div>

<div>
<span class="symbol turistica"></span>
Turística
</div>

<div>
<span class="symbol familiar"></span>
Familiar
</div>

<div>
<span class="symbol natural"></span>
Natural
</div>
`;

return div;
};

legend.addTo(map);

// SOLUCIÓN DEL PROBLEMA DE MAPA EN BLANCO
setTimeout(function(){
map.invalidateSize();
},500);

</script>

</body>
</html>
