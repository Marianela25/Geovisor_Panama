<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geovisor Panamá</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
padding:0;
}

#map{
height:100vh;
width:100%;
}

.titulo{
position:absolute;
top:10px;
left:50px;
z-index:1000;
background:white;
padding:10px;
border-radius:8px;
font-family:Arial;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

</style>

</head>

<body>

<div class="titulo">
<h2>Geovisor Panamá</h2>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([8.5,-80],7);

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

const satelite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
attribution:'Esri'
}
);

const baseMaps = {
"OpenStreetMap": osm,
"Satélite": satelite
};

L.control.layers(baseMaps).addTo(map);

L.marker([8.9833,-79.5167])
.addTo(map)
.bindPopup(`
<h2>Ciudad de Panamá</h2>

<p><b>Población:</b> 1.5 millones</p>

<p><b>Provincia:</b> Panamá</p>

<p><b>Actividad:</b> Turismo y comercio</p>

<img 
src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Panama_City_Skyline.jpg"
width="250">
`);

  L.marker([8.9833,-79.5167])
.addTo(map)
.bindPopup("Ciudad de Panamá");

L.marker([8.4333,-80.5333])
.addTo(map)
.bindPopup("Penonomé");

L.marker([8.1,-80.97])
.addTo(map)
.bindPopup("Santiago");
  
</script>

</body>
</html>
