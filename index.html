 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Provincias de Panamá y Clima</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body{
            margin:0;
            padding:0;
        }

        #map{
            width:100%;
            height:100vh;
        }

        .titulo{
            position:absolute;
            top:10px;
            left:50px;
            z-index:1000;
            background:white;
            padding:10px 15px;
            border-radius:10px;
            font-family:Arial;
            font-size:20px;
            font-weight:bold;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

<div class="titulo">
    Provincias de Panamá con Clima
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Librería para SHP -->
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>

<script>

    // CREAR MAPA
    var map = L.map('map').setView([8.5, -80], 7);

    // MAPA BASE
    var osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap'
        }
    ).addTo(map);

    // CAPA CLIMÁTICA
    var clima = L.tileLayer(
        'https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=TU_API_KEY',
        {
            attribution:'© OpenWeatherMap',
            opacity:0.5
        }
    ).addTo(map);

    // COLORES ALEATORIOS
    function getColor(){
        var colors = [
            "#ff0000",
            "#00ff00",
            "#0000ff",
            "#ffff00",
            "#ff00ff",
            "#00ffff",
            "#ffa500",
            "#800080",
            "#008000",
            "#8b4513"
        ];

        return colors[Math.floor(Math.random() * colors.length)];
    }

    // CARGAR SHAPEFILE DE PROVINCIAS
    shp("data/provincias_panama.zip").then(function(data){

        var provincias = L.geoJSON(data,{

            style:function(feature){
                return{
                    color:"black",
                    weight:1.5,
                    fillColor:getColor(),
                    fillOpacity:0.5
                };
            },

            onEachFeature:function(feature, layer){

                var nombre = "Provincia";

                if(feature.properties.NAME_1){
                    nombre = feature.properties.NAME_1;
                }

                layer.bindPopup(
                    "<h3>" + nombre + "</h3>"
                );
            }

        }).addTo(map);

        // AJUSTAR MAPA
        map.fitBounds(provincias.getBounds());

        // CONTROL DE CAPAS
        var overlays = {
            "Clima": clima,
            "Provincias": provincias
        };

        L.control.layers(
            {
                "OpenStreetMap": osm
            },
            overlays
        ).addTo(map);

    });

</script>

</body>
</html>
