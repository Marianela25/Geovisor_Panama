<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeoVisor Panamá</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body{
    height:100%;
    margin:0;
    padding:0;
}

#map{
    width:100%;
    height:100vh;
}

.titulo{
    position:absolute;
    top:10px;
    left:50px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:10px;
    font-family:Arial;
    font-weight:bold;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<div class="titulo">
    GeoVisor Distritos y Playas de Panamá
</div>

<div id="map"></div>

<script>

// Crear mapa
var map = L.map('map').setView([8.5379, -80.7821], 7);

// Mapa base
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap'
}).addTo(map);


// Colores aleatorios para distritos
function getColor() {

    const colores = [
        "#ff0000",
        "#00ff00",
        "#0000ff",
        "#ff9900",
        "#9900ff",
        "#00ffff",
        "#ff00aa",
        "#ffff00",
        "#00aa55",
        "#5555ff"
    ];

    return colores[Math.floor(Math.random() * colores.length)];
}


// Estilo distritos
function estiloDistritos(feature) {
    return {
        fillColor: getColor(),
        weight: 1,
        opacity: 1,
        color: 'black',
        fillOpacity: 0.6
    };
}


// Cargar distritos
fetch('distritos_panama.geojson')
.then(response => response.json())
.then(data => {

    L.geoJSON(data, {

        style: estiloDistritos,

        onEachFeature: function(feature, layer){

            layer.bindPopup(
                "<b>Distrito:</b> " +
                feature.properties.NOMBRE
            );

        }

    }).addTo(map);

});


// Icono playas
var iconoPlaya = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/590/590685.png',
    iconSize: [30,30]
});


// Cargar playas
fetch('playas_panama.geojson')
.then(response => response.json())
.then(data => {

    L.geoJSON(data, {

        pointToLayer: function(feature, latlng){

            return L.marker(latlng, {
                icon: iconoPlaya
            });

        },

        onEachFeature: function(feature, layer){

            layer.bindPopup(
                "<b>Playa:</b> " +
                feature.properties.NOMBRE
            );

        }

    }).addTo(map);

});

</script>

</body>
</html>
